<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверки интерфейса — Седьмое</title>
<style>body{font:15px system-ui;margin:30px;color:#243c2c}button{padding:12px 20px}li{margin:12px 0}iframe{width:100%;height:650px;border:1px solid #ccc;margin-top:25px}pre{white-space:pre-wrap;color:#a23}small{display:block;margin:15px 0;color:#777}</style>
<h1>Проверки интерфейса</h1>
<p>Изолированные тестовые работы: данные основного тренажёра не меняются.</p>
<button id="run">Запустить проверки</button>
<p id="status" role="status">Готово к запуску</p>
<ol id="results"></ol>
<iframe id="fixture" title="Тестовый тренажёр"></iframe>
<script src="../js/tasks.js"></script><script src="../js/core.js"></script>
<script>
const results = document.querySelector('#results');
const frame = document.querySelector('#fixture');
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const assert = (condition, text) => { if (!condition) throw new Error(text); };
async function until(condition) {
  for (let i = 0; i < 100; i++) { if (condition()) return; await pause(50); }
  throw new Error('Истекло ожидание интерфейса');
}
function example(minutesAgo = 0, count = 8) {
  return EgeCore.createSession({firstName:'Тест',lastName:'Автопроверка',className:'11 Т'}, count, 15, 2026, Date.now() - minutesAgo * 60000);
}
async function mount(state, blocked = false) {
  const html = await (await fetch('../index.html')).text();
  const base = new URL('../', location.href).href;
  const bootstrap = `<base href="${base}"><script>
    const initial = ${JSON.stringify(state)};
    let saved = initial ? JSON.stringify(initial) : null;
    Object.defineProperty(window, 'localStorage', {value: {
      getItem: () => { ${blocked ? "throw new Error('blocked')" : 'return saved'} },
      setItem: (_, value) => { ${blocked ? "throw new Error('blocked')" : 'saved = value'} },
      removeItem: () => { saved = null; }
    }});
    Object.defineProperty(navigator, 'locks', {value: undefined});
    Object.defineProperty(document, 'fullscreenEnabled', {value: false});
    Object.defineProperty(document, 'hasFocus', {value: () => true});
  <\/script>`;
  frame.srcdoc = html.replace('<head>', '<head>' + bootstrap);
  await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  return { doc: frame.contentDocument, win: frame.contentWindow };
}
const checks = [
  ['Истечение таймера автоматически завершает работу и сохраняет оценку', async () => {
    const s = example(14.98);
    s.lastSeenAt = Date.now();
    s.answers = EgeTasks.generateQuestions(s.count,s.seed).map((q,i) => i === 7 ? '' : String(q.answer));
    const {doc} = await mount(s);
    await until(() => !doc.querySelector('#results-screen').hidden);
    assert(doc.querySelector('.grade-circle strong').textContent === '5', 'Ожидалась оценка 5 за 7/8');
    assert(doc.querySelector('.result-stats').textContent.includes('Время вышло'), 'Нет причины «Время вышло»');
    assert(doc.querySelectorAll('.review-item').length === 8, 'Потерян разбор');
    assert(doc.querySelector('#app-dialog').open === false, 'Остался открытый диалог');
  }],
  ['Восстановление, дробный ответ, навигация, объединение событий и ручное завершение', async () => {
    const s = example();
    s.answers[0] = '123,5';
    s.flags[0] = true;
    const {doc,win} = await mount(s);
    await until(() => !doc.querySelector('#exam-screen').hidden);
    assert(doc.querySelector('#answer-input').value === '123,5', 'Не восстановлен ответ');
    assert(doc.querySelector('#flag-button').getAttribute('aria-pressed') === 'true', 'Не восстановлен флаг');
    doc.querySelector('#next-button').click();
    doc.querySelector('#previous-button').click();
    assert(doc.querySelector('#answer-input').value === '123,5', 'Ответ потерян при навигации');
    win.dispatchEvent(new Event('blur'));
    Object.defineProperty(doc,'hidden',{configurable:true,value:true});
    doc.dispatchEvent(new Event('visibilitychange'));
    assert(doc.querySelector('#away-count').textContent === '1', 'Двойной учёт одного ухода');
    Object.defineProperty(doc,'hidden',{configurable:true,value:false});
    win.dispatchEvent(new Event('focus'));
    Object.defineProperty(doc,'fullscreenElement',{configurable:true,value:doc.documentElement});
    doc.dispatchEvent(new Event('fullscreenchange'));
    Object.defineProperty(doc,'fullscreenElement',{configurable:true,value:null});
    doc.dispatchEvent(new Event('fullscreenchange'));
    const correct = EgeTasks.generateQuestions(s.count,s.seed)[0].answer;
    doc.querySelector('#answer-input').value = String(correct).replace('.', ',');
    doc.querySelector('#answer-input').dispatchEvent(new Event('input',{bubbles:true}));
    doc.querySelector('#finish-button').click();
    assert(doc.querySelector('#app-dialog').open, 'Нет подтверждения завершения');
    doc.querySelector('[data-dialog-action="1"]').click();
    await until(() => !doc.querySelector('#results-screen').hidden);
    assert(doc.querySelector('.score-ratio').textContent.trim() === '1/ 8', 'Неправильное число верных ответов');
    assert(doc.querySelectorAll('.activity-table tbody tr').length === 3, 'Ожидалось 3 события: восстановление, уход, полный экран');
    doc.querySelector('[data-filter="correct"]').click();
    assert(doc.querySelectorAll('.review-item').length === 1, 'Фильтр верных ответов не сработал');
    win.dispatchEvent(new Event('beforeprint'));
    assert(doc.querySelectorAll('.review-item[open]').length === 8, 'Для печати открылись не все решения');
    win.dispatchEvent(new Event('afterprint'));
    assert(doc.querySelectorAll('.review-item').length === 1, 'Не восстановлен фильтр после печати');
  }],
  ['Работа продолжается при недоступном хранилище и полном экране', async () => {
    const {doc} = await mount(null, true);
    await until(() => doc.querySelector('#fullscreen-setting').disabled);
    doc.querySelector('#first-name').value = 'Тест';
    doc.querySelector('#last-name').value = 'Проверка';
    doc.querySelector('#class-name').value = '11 А';
    doc.querySelector('.start-button').click();
    await until(() => !doc.querySelector('#exam-screen').hidden);
    assert(doc.querySelector('#save-status').textContent.includes('недоступно'), 'Нет предупреждения о сохранении');
    assert(doc.querySelector('#fullscreen-button').hidden, 'Показывается недоступный полный экран');
    doc.querySelector('#finish-button').click();
    doc.querySelector('[data-dialog-action="1"]').click();
    await until(() => !doc.querySelector('#results-screen').hidden);
    assert(doc.querySelector('.grade-circle strong').textContent === '1', 'За пустую работу ожидалась оценка 1');
  }],
];
document.querySelector('#run').onclick = async () => {
  document.querySelector('#run').disabled = true;
  document.querySelector('#status').textContent = 'Выполняются проверки…';
  results.innerHTML = '';
  let passed = 0;
  for (const [name, test] of checks) {
    const li = document.createElement('li'); results.append(li);
    try { await test(); li.textContent = '✓ ' + name; passed++; }
    catch (e) { li.textContent = '✗ ' + name + ': ' + e.message; li.style.color = '#a23'; }
  }
  document.querySelector('#status').textContent = `Пройдено: ${passed} из ${checks.length}`;
  document.querySelector('#run').disabled = false;
};
</script>

name: Check and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check tasks and answer keys
        run: npm test
      - name: Validate static site and learning materials
        run: npm run build
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Audit all 400 OGE tasks and every practical format
        run: npm run audit:oge
      - name: Check browser flows at a repository subpath
        run: npm run test:pages
      - name: Check custom OGE practice and result transfer
        run: npm run test:oge-builder
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-reports
          path: |
            quality/oge-audit.json
            output/oge-audit-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
